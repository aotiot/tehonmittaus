; PlatformIO-projekti INA226 Power Loggerille.
; Arduino IDE -käyttäjät voivat jättää tämän tiedoston huomiotta.
;
; Valitse ympäristö levysi mukaan:
;   pio run -e devkitm   -t upload   (ESP32-C3-DevKitM-1, UART-USB-silta)
;   pio run -e supermini -t upload   (SuperMini ym. natiivi-USB-levyt)
;   pio run -e xiao      -t upload   (Seeed XIAO ESP32C3; vaihda koodista SDA=6, SCL=7)

[platformio]
src_dir = ina226_logger
default_envs = devkitm

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    robtillaart/INA226@^0.6.0

[env:devkitm]
board = esp32-c3-devkitm-1

[env:supermini]
board = esp32-c3-devkitm-1
; Natiivi USB: Serial ohjataan USB-CDC:hen, muuten tulostus ei näy.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao]
board = seeed_xiao_esp32c3
